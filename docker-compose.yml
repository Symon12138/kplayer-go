services:
  kplayer:
    # 已发布镜像可直接拉取；无网络时删除 image 行改用本地构建
    image: ghcr.io/symon12138/kplayer-go:latest
    build: .
    ports:
      - "4155:4155"
      - "4156:4156"
    volumes:
      - ./data:/kplayer/data          # 业务数据（management.json 等）
      - ./video:/kplayer/video        # 媒体文件
      - ./config.json:/kplayer/config.json
    restart: unless-stopped